<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <!-- Link to external CSS stylesheet (Part 2, Step 9) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Student Grade Calculator</h2>

    <!-- Added 'return' so returning false prevents page reload -->
    <form name="gradeForm" onsubmit="return checkMark()">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter student name"><br>

        <label for="mark">Mark (0-100): </label>
        <input type="text" id="mark" name="mark" placeholder="Enter mark (0-100)"><br>

        <div class="button-group">
            <button type="submit">Check Grade</button>
            <!-- Added Random Mark button (Part 2, Step 7) -->
            <button type="button" onclick="generateRandomMark()">Random Mark</button>
        </div>
    </form>

    <!-- Result display and timestamp -->
    <p id="result"></p>
    <!-- Added timestamp display (Part 2, Step 8) -->
    <p id="checkedTime"></p>

    <!-- Fixed function name casing from showtable() to showTable() -->
    <button type="button" onclick="showTable()">Show Grade Table</button>
    <div id="tableContainer"></div>
</div>

<!-- Fixed script filename from grades.js to grade.js -->
<script src="grade.js"></script>
</body>
</html>
