<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header Section: Game title and instructions -->
<header>
    <h1>Rock, Paper, Scissors</h1>
    <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
</header>

<main>
    <!-- Player Section: Name input and Start button -->
    <section class="card" id="playerSection">
        <label for="playerName">Your name:</label>
        <input type="text" id="playerName" placeholder="Enter your name">
        <button onclick="startGame()">Start Game</button>
        <p id="welcomeMsg"></p>
    </section>

    <!-- Game Section: Choice buttons and image display -->
    <section class="card" id="gameSection">
        <div class="choice-buttons">
            <button onclick="playRound('rock')">Rock</button>
            <button onclick="playRound('paper')">Paper</button>
            <button onclick="playRound('scissors')">Scissors</button>
        </div>

        <div class="battle-arena">
            <div class="fighter">
                <h3>You</h3>
                <img id="playerImg" src="rock.png
" alt="Player Choice">
            </div>
            <div class="vs-text">VS</div>
            <div class="fighter">
                <h3>Computer</h3>
                <img id="computerImg" src="rock.png" alt="Computer Choice">
            </div>
        </div>
    </section>

    <!-- Result & Scoreboard Section -->
    <section class="card" id="resultSection">
        <p id="result"></p>
        <div class="scoreboard">
            <span>Wins: <strong id="wins">0</strong></span>
            <span>Losses: <strong id="losses">0</strong></span>
            <span>Draws: <strong id="draws">0</strong></span>
        </div>
    </section>

    <!-- History & Controls Section -->
    <section class="card" id="historySection">
        <h2>History</h2>
        <table id="history">
            <thead>
            <tr>
                <th>Round</th>
                <th>You</th>
                <th>Computer</th>
                <th>Result</th>
            </tr>
            </thead>
            <!-- tbody keeps header row intact when resetting -->
            <tbody id="historyBody">
            </tbody>
        </table>

        <div class="control-buttons">
            <button onclick="showSummary()">Show Summary</button>
            <button onclick="resetGame()">Reset</button>
        </div>
        <p id="summaryText"></p>
    </section>
</main>

<!-- Footer Section: Start timestamp and copyright -->
<footer>
    <p id="startTime"></p>
    <p>&copy; 2026 Computer Science Club</p>
</footer>

<!-- Link to external JavaScript file -->
<script src="game.js"></script>
</body>
</html>
